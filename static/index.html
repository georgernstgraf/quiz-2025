<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Willkommen & Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { color: #333; text-align: center; }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        #createBtn { background-color: #4CAF50; }
        #joinBtn { background-color: #2196F3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .error-message {
            color: #f44336;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .scores-section {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .scores-list { list-style: none; padding: 0; margin: 0; }
        .scores-list li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

    <h1>Willkommen beim ultimativen Quiz!</h1>

    <div class="container">
        <div id="error" class="error-message"></div>

        <div class="form-group">
            <label for="displayName">Dein Anzeigename:</label>
            <input type="text" id="displayName" placeholder="Name eingeben" required>
        </div>

        <div class="form-group">
            <label for="roomCode">Raumcode (um Partner beizutreten):</label>
            <input type="text" id="roomCode" placeholder="6-stelliger Code" maxlength="6">
        </div>

        <hr>

        <h3>Neues Spiel erstellen</h3>
        <div class="form-group">
            <label for="difficulty">Schwierigkeit:</label>
            <select id="difficulty">
                <option value="easy">Leicht</option>
                <option value="medium">Mittel</option>
                <option value="hard">Schwer</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topic">Thema (Topic):</label>
            <select id="topic">
                <option value="Sports">Sport</option>
                <option value="History">Geschichte</option>
                <option value="Science">Wissenschaft</option>
            </select>
        </div>

        <div class="button-group">
            <button id="createBtn" onclick="createGame()">Neues Spiel</button>
            <button id="joinBtn" onclick="joinGame()">Beitreten</button>
        </div>
    </div>

    <div class="scores-section">
        <h2>Aktuelle Top Scores</h2>
        <ul class="scores-list" id="scoreList">
            <li><span>Max Mustermann</span> <span>150 Pkt.</span></li>
            <li><span>Lisa Müller</span> <span>120 Pkt.</span></li>
            <li><span>Spieler3</span> <span>90 Pkt.</span></li>
        </ul>
    </div>

    <script>
        const displayNameInput = document.getElementById('displayName');
        const roomCodeInput = document.getElementById('roomCode');
        const difficultySelect = document.getElementById('difficulty');
        const topicSelect = document.getElementById('topic');
        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');
        const errorDiv = document.getElementById('error');

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            errorDiv.style.display = 'none';
        }

        async function createGame() {
            hideError();
            const displayName = displayNameInput.value.trim();
            
            if (!displayName) {
                showError('Bitte gib einen Anzeigenamen ein.');
                return;
            }

            createBtn.disabled = true;
            
            // Einstellungen speichern, damit die Quiz-Seite später weiß, was gewählt wurde
            sessionStorage.setItem('quizDifficulty', difficultySelect.value);
            sessionStorage.setItem('quizCategory', topicSelect.value);
            
            try {
                const response = await fetch('/api/create-game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ displayName })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Fehler beim Erstellen des Spiels');
                    createBtn.disabled = false;
                    return;
                }

                sessionStorage.setItem('accountId', data.accountId);
                window.location.href = `/lobby.html?room=${data.roomCode}`;
            } catch (err) {
                showError('Verbindungsfehler. Bitte versuche es erneut.');
                createBtn.disabled = false;
            }
        }

        async function joinGame() {
            hideError();
            const displayName = displayNameInput.value.trim();
            const roomCode = roomCodeInput.value.trim();

            if (!displayName || !/^\d{6}$/.test(roomCode)) {
                showError('Bitte gib Namen und einen 6-stelligen Raumcode ein.');
                return;
            }

            joinBtn.disabled = true;

            try {
                const response = await fetch('/api/join-game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ displayName, roomCode })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Fehler beim Beitreten des Spiels');
                    joinBtn.disabled = false;
                    return;
                }

                sessionStorage.setItem('accountId', data.accountId);
                window.location.href = `/lobby.html?room=${data.roomCode}`;
            } catch (err) {
                showError('Verbindungsfehler. Bitte versuche es erneut.');
                joinBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
