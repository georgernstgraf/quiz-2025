<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Lobby</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .lobby-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .room-code-container {
            margin: 30px 0;
        }
        .room-code-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .room-code {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            letter-spacing: 8px;
            background-color: #f0f0f0;
            padding: 20px 30px;
            border-radius: 10px;
            display: inline-block;
        }
        .share-hint {
            color: #777;
            font-size: 14px;
            margin-top: 15px;
        }
        .participants-section {
            margin-top: 30px;
            text-align: left;
        }
        .participants-title {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .participant-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .participant {
            padding: 12px 15px;
            background-color: #f9f9f9;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .participant-icon {
            width: 30px;
            height: 30px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .participant-name {
            flex: 1;
            font-size: 16px;
        }
        .participant.creator {
            background-color: #e8f5e9;
        }
        .participant.creator .participant-icon {
            background-color: #2196F3;
        }
        .creator-badge {
            font-size: 12px;
            color: #2196F3;
            font-weight: bold;
        }
        .actions {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .start-btn {
            background-color: #4CAF50;
            color: white;
        }
        .start-btn:hover:not(:disabled) {
            background-color: #45a049;
        }
        .start-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .leave-btn {
            background-color: #f44336;
            color: white;
        }
        .leave-btn:hover {
            background-color: #d32f2f;
        }
        .error-message {
            color: #f44336;
            background-color: #ffebee;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .participant-count {
            color: #777;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="lobby-container">
        <div id="error" class="error-message" style="display: none;"></div>
        
        <h1>Quiz Lobby</h1>
        
        <div class="room-code-container">
            <div class="room-code-label">Raumcode</div>
            <div id="roomCode" class="room-code loading">Laden...</div>
            <div class="share-hint">Teile diesen Code mit deinen Freunden!</div>
        </div>
        
        <div class="participants-section">
            <div class="participants-title">Teilnehmer</div>
            <ul id="participantList" class="participant-list">
                <li class="loading">Laden...</li>
            </ul>
            <div id="participantCount" class="participant-count"></div>
        </div>
        
        <div class="actions">
            <button id="startBtn" class="start-btn" style="display: none;" onclick="startGame()">Spiel starten</button>
            <button class="leave-btn" onclick="leaveLobby()">Verlassen</button>
        </div>
    </div>

    <script>
        const roomCodeEl = document.getElementById('roomCode');
        const participantListEl = document.getElementById('participantList');
        const participantCountEl = document.getElementById('participantCount');
        const startBtnEl = document.getElementById('startBtn');
        const errorEl = document.getElementById('error');

        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        const accountId = sessionStorage.getItem('accountId');

        let pollInterval;
        let sessionData = null;

        if (!roomCode) {
            showError('Kein Raumcode angegeben.');
        } else {
            loadSession();
            pollInterval = setInterval(loadSession, 3000);
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        async function loadSession() {
            try {
                const response = await fetch(`/api/session/${roomCode}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        showError('Raum nicht gefunden.');
                        clearInterval(pollInterval);
                        return;
                    }
                    throw new Error('Fehler beim Laden der Sitzung');
                }

                sessionData = await response.json();
                renderSession();
            } catch (err) {
                console.error('Fehler:', err);
            }
        }

        function renderSession() {
            roomCodeEl.textContent = sessionData.roomCode;
            roomCodeEl.classList.remove('loading');

            const isCreator = sessionData.creatorId === accountId;
            
            if (isCreator && sessionData.status === 'WAITING') {
                startBtnEl.style.display = 'inline-block';
                startBtnEl.disabled = sessionData.participants.length < 1;
            } else {
                startBtnEl.style.display = 'none';
            }

            if (sessionData.status === 'IN_PROGRESS') {
                window.location.href = `/quiz.html?room=${roomCode}`;
                return;
            }

            participantListEl.innerHTML = sessionData.participants.map(p => {
                const isThisCreator = p.id === sessionData.creatorId || 
                    (sessionData.participants.length > 0 && 
                     sessionData.participants[0].id === p.id && 
                     sessionData.creatorId === accountId);
                const initial = p.displayName.charAt(0).toUpperCase();
                
                return `
                    <li class="participant ${isThisCreator ? 'creator' : ''}">
                        <div class="participant-icon">${initial}</div>
                        <span class="participant-name">${escapeHtml(p.displayName)}</span>
                        ${isThisCreator ? '<span class="creator-badge">HOST</span>' : ''}
                    </li>
                `;
            }).join('');

            const count = sessionData.participants.length;
            participantCountEl.textContent = `${count} ${count === 1 ? 'Teilnehmer' : 'Teilnehmer'}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function startGame() {
            window.location.href = `/quiz.html?room=${roomCode}`;
        }

        function leaveLobby() {
            sessionStorage.removeItem('accountId');
            window.location.href = '/index.html';
        }

        window.addEventListener('beforeunload', () => {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });
    </script>
</body>
</html>
